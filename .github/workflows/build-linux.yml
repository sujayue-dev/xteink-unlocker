name: Build Linux

# Builds + signs + uploads the Linux x86_64 artifacts (AppImage, deb, rpm,
# AppImage.tar.gz updater bundle) and writes latest-linux-x86_64.json to R2.
#
# Trigger: a `vX.Y.Z` tag push (matches scripts/release.sh) or manual dispatch.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY            minisign private key (single-line)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   optional, if the key is password-protected
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_R2_ACCESS_KEY
#   CLOUDFLARE_R2_SECRET_KEY
#   CLOUDFLARE_R2_BUCKET                 optional, defaults to "unlocker-releases"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to Cloudflare R2 + write update manifest'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            rpm \
            jq

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build (helper + Tauri bundle)
        run: ./scripts/build-linux.sh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts to GH Actions
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

      - name: Install AWS CLI
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload
        run: |
          # awscli is preinstalled on ubuntu-22.04 runners; ensure jq + a recent
          # version are available regardless.
          aws --version

      - name: Upload to Cloudflare R2 + write manifest
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload
        run: ./scripts/upload-to-cloudflare-linux.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
