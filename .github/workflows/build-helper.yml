name: Build Unlocker Helper

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Build helper
        run: cargo build --release -p unlocker-helper
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlocker-helper-windows
          path: target/release/unlocker-helper.exe
